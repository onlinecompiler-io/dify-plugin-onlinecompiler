identity:
  author: onlinecompiler
  name: onlinecompiler
  label:
    en_US: OnlineCompiler.io
    zh_Hans: OnlineCompiler.io
    ja_JP: OnlineCompiler.io
    pt_BR: OnlineCompiler.io
  description:
    en_US: Run and judge code in 46 languages in a sandbox with no network, through the OnlineCompiler.io API.
    zh_Hans: 通过 OnlineCompiler.io API，在无网络的沙箱中运行和评测 46 种语言的代码。
    ja_JP: OnlineCompiler.io API を使い、ネットワークのないサンドボックスで 46 言語のコードを実行・採点します。
    pt_BR: Execute e avalie código em 46 linguagens numa sandbox sem rede, pela API do OnlineCompiler.io.
  icon: icon.svg
  tags:
    - education
    - utilities
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: API Key
      zh_Hans: API 密钥
      ja_JP: API キー
      pt_BR: Chave de API
    placeholder:
      en_US: Your OnlineCompiler.io API key
      zh_Hans: 你的 OnlineCompiler.io API 密钥
      ja_JP: OnlineCompiler.io の API キー
      pt_BR: Sua chave de API do OnlineCompiler.io
    help:
      en_US: Sign in with Google or email and copy the key shown on your API Keys page; every new account already has one. The Free plan includes 100,000 runs a month, no card.
      zh_Hans: 用 Google 或邮箱登录，复制 API Keys 页面上显示的密钥；每个新账户都已自带一个。免费套餐每月包含 100,000 次运行，无需信用卡。
      ja_JP: Google またはメールでサインインし、API Keys ページに表示されるキーをコピーしてください。新しいアカウントには最初からキーがあります。Free プランには毎月 100,000 回の実行が含まれ、カードは不要です。
      pt_BR: Entre com Google ou e-mail e copie a chave mostrada na página API Keys; toda conta nova já tem uma. O plano Free inclui 100.000 execuções por mês, sem cartão.
    url: https://api.onlinecompiler.io/compilers/api-keys/?utm_source=dify
tools:
  - tools/run_code.yaml
  - tools/run_tests.yaml
  - tools/list_compilers.yaml
extra:
  python:
    source: provider/onlinecompiler.py
