  zh_Hans: OnlineCompiler.io
  ja_JP: OnlineCompiler.io
  pt_BR: OnlineCompiler.io
description:
  en_US: Run and judge code in 46 languages in a sandbox with no network. Get stdout, stderr, exit code, time and memory, or check a program against test cases for a verdict and a score.
  zh_Hans: 在无网络的沙箱中运行和评测 46 种语言的代码。获取标准输出、标准错误、退出码、运行时间和内存，或用测试用例检查程序，得到判定结果和分数。
  ja_JP: ネットワークのないサンドボックスで 46 言語のコードを実行・採点します。標準出力、標準エラー、終了コード、実行時間とメモリを取得するか、テストケースでプログラムを検証して判定とスコアを得られます。
  pt_BR: Execute e avalie código em 46 linguagens numa sandbox sem rede. Obtenha stdout, stderr, código de saída, tempo e memória, ou verifique um programa com casos de teste e receba um veredito e uma nota.
