  - name: code
    type: string
    required: true
    label:
      en_US: Code
      zh_Hans: 代码
      ja_JP: コード
      pt_BR: Código
    human_description:
      en_US: The whole program to judge, as one source file.
      zh_Hans: 要评测的完整程序，作为一个源文件。
      ja_JP: 採点するプログラム全体（1 つのソースファイル）。
      pt_BR: O programa inteiro a avaliar, como um único arquivo-fonte.
    llm_description: >-
      The complete program as one source file. It reads each test's input from standard input and prints its answer
      to standard output.
    form: llm
  - name: tests
    type: string
    required: true
    label:
      en_US: Tests (JSON)
      zh_Hans: 测试用例（JSON）
      ja_JP: テストケース（JSON）
      pt_BR: Testes (JSON)
    human_description:
      en_US: 'A JSON list of tests, for example [{"input": "2 3", "expected_output": "5"}]. Add "hidden": true to show only a test''s verdict.'
      zh_Hans: 'JSON 格式的测试列表，例如 [{"input": "2 3", "expected_output": "5"}]。加上 "hidden": true 则只显示该测试的判定。'
      ja_JP: 'テストの JSON リスト。例：[{"input": "2 3", "expected_output": "5"}]。"hidden": true を付けると判定だけを返します。'
      pt_BR: 'Uma lista JSON de testes, por exemplo [{"input": "2 3", "expected_output": "5"}]. Adicione "hidden": true para mostrar só o veredito do teste.'
    llm_description: >-
      A JSON list of test cases, each an object with input (the text given on standard input; may be empty) and
      expected_output (what a correct program prints), for example [{"input": "2 3", "expected_output": "5"},
      {"input": "10 -4", "expected_output": "6"}]. Add "hidden": true to a test to get back only its verdict.
    form: llm
  - name: checker
    type: select
    required: false
    default: trim
    label:
      en_US: Checker
      zh_Hans: 比较方式
      ja_JP: 比較方法
      pt_BR: Comparador
    human_description:
      en_US: How the output is compared with expected_output. Default trim.
      zh_Hans: 输出与 expected_output 的比较方式。默认 trim。
      ja_JP: 出力と expected_output の比較方法。既定は trim。
      pt_BR: Como a saída é comparada com expected_output. Padrão trim.
    llm_description: >-
      How output is compared: trim ignores trailing whitespace (default), exact is byte for byte, tokens ignores all
      whitespace differences, float compares numbers within a small tolerance, rows compares lines as an unordered set
      (for SQL and pandas output), table compares CSV tables with a header row by column name with rows in any order
      (print df.to_csv()), and table_ordered does the same with rows in order.
    form: llm
    options:
      - value: trim
        label:
          en_US: trim (ignore trailing whitespace)
      - value: exact
        label:
          en_US: exact (byte for byte)
      - value: tokens
        label:
          en_US: tokens (ignore whitespace differences)
      - value: float
        label:
          en_US: float (numbers within a tolerance)
      - value: rows
        label:
          en_US: rows (lines in any order)
      - value: table
        label:
          en_US: table (CSV, rows in any order)
      - value: table_ordered
        label:
          en_US: table_ordered (CSV, rows in order)
  - name: time_limit
    type: number
    required: false
    min: 0
    max: 30
    label:
      en_US: Time Limit per Test (seconds)
      zh_Hans: 每个测试的时间限制（秒）
      ja_JP: テストごとの制限時間（秒）
      pt_BR: Limite de tempo por teste (segundos)
    human_description:
      en_US: Seconds each test may take, above 0 and at most 30. Leave empty for 2.
      zh_Hans: 每个测试可运行的秒数，大于 0 且不超过 30。留空则为 2。
      ja_JP: 各テストが実行できる秒数（0 より大きく 30 以下）。空欄なら 2。
      pt_BR: Segundos que cada teste pode levar, acima de 0 e no máximo 30. Deixe vazio para 2.
    llm_description: Seconds each test may take, above 0 and at most 30. Leave it out for the default of 2.
    form: llm
output_schema:
  type: object
  properties:
    verdict:
      type: string
      description: The overall verdict, accepted when every test passed.
    score:
      type: number
      description: The percentage of tests passed, 0 to 100.
    passed:
      type: number
      description: Tests passed.
    total:
      type: number
      description: Tests sent.
    summary:
      type: string
      description: One or two plain sentences about the result.
    compile_error:
      type: string
      description: The compiler's output when the code did not compile, otherwise empty.
    submission:
      type: string
      description: The id the result is stored under on OnlineCompiler.io.
extra:
  python:
    source: tools/run_tests.py
