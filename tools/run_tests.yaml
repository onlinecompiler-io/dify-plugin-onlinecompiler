identity:
  name: run_tests
  author: onlinecompiler
  label:
    en_US: Run Tests
    zh_Hans: 运行测试
    ja_JP: テストを実行
    pt_BR: Executar testes
description:
  human:
    en_US: Judge a program against test cases and get a verdict per test, an overall verdict and a score.
    zh_Hans: 用测试用例评测程序，返回每个测试的判定、总体判定和分数。
    ja_JP: テストケースでプログラムを採点し、テストごとの判定、総合判定とスコアを返します。
    pt_BR: Avalie um programa com casos de teste e receba um veredito por teste, um veredito geral e uma nota.
  llm: >-
    Judge a program against test cases in the OnlineCompiler.io sandbox: each test runs the program with the test's
    input on standard input and compares what it prints with expected_output. Returns an overall verdict (accepted,
    wrong_answer, time_limit_exceeded, memory_limit_exceeded, runtime_error, compilation_error and others), a score
    from 0 to 100 (the percentage of tests passed), a short summary and a verdict per test. Every test runs, and
    each counts as one run.
parameters:
  - name: compiler
    type: select
    required: true
    default: python-3.14
    label:
      en_US: Compiler
      zh_Hans: 编译器
      ja_JP: コンパイラ
      pt_BR: Compilador
    human_description:
      en_US: The language and version to run the code with, for example python-3.14 or gcc-15.
      zh_Hans: 运行代码所用的语言和版本，例如 python-3.14 或 gcc-15。
      ja_JP: コードを実行する言語とバージョン。例：python-3.14、gcc-15。
      pt_BR: A linguagem e a versão para executar o código, por exemplo python-3.14 ou gcc-15.
    llm_description: >-
      The compiler id. Common ones: python-3.14 (with numpy, pandas, scipy, scikit-learn, matplotlib and more),
      nodejs-24 (JavaScript), typescript-deno, gcc-15 (C), g++-15 (C++), openjdk-25 (Java), go-1.26, rust-1.93,
      dotnet-csharp-10 (C#), php-8.5, ruby-4.0, kotlin-2.4, swift-6.4, bash-5.2, sqlite-3 and duckdb-1.5 (SQL).
      Default python-3.14.
    form: llm
    options:
