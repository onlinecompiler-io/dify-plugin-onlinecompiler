identity:
  name: run_code
  author: onlinecompiler
  label:
    en_US: Run Code
    zh_Hans: 运行代码
    ja_JP: コードを実行
    pt_BR: Executar código
description:
  human:
    en_US: Run a program in a sandbox and get its output, errors, exit code, time and memory.
    zh_Hans: 在沙箱中运行程序，返回输出、错误、退出码、运行时间和内存。
    ja_JP: サンドボックスでプログラムを実行し、出力、エラー、終了コード、実行時間とメモリを返します。
    pt_BR: Execute um programa numa sandbox e receba a saída, os erros, o código de saída, o tempo e a memória.
  llm: >-
    Run a program in the OnlineCompiler.io sandbox (no network, up to 30 seconds, 512 MB) and get its standard
    output, standard error, exit code, time and memory. Use it to compute answers or check code instead of guessing.
    Exit code 124 means the program ran out of time and 137 that it ran out of memory. Files the program writes to
    the directory in the OUTPUT_DIR environment variable (PNG, SVG, CSV, JSON or text, up to 8 files and 2 MB) come
    back as files, so a matplotlib chart shows as an image: plt.show() saves each open figure.
parameters:
