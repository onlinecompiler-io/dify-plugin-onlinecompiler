    type: select
    required: true
    default: python-3.14
    label:
      en_US: Compiler
      zh_Hans: 编译器
      ja_JP: コンパイラ
      pt_BR: Compilador
    human_description:
      en_US: The language and version to run the code with, for example python-3.14 or gcc-15.
      zh_Hans: 运行代码所用的语言和版本，例如 python-3.14 或 gcc-15。
      ja_JP: コードを実行する言語とバージョン。例：python-3.14、gcc-15。
      pt_BR: A linguagem e a versão para executar o código, por exemplo python-3.14 ou gcc-15.
    llm_description: >-
      The compiler id. Common ones: python-3.14 (with numpy, pandas, scipy, scikit-learn, matplotlib and more),
