  - name: code
    type: string
    required: true
    label:
      en_US: Code
      zh_Hans: 代码
      ja_JP: コード
      pt_BR: Código
    human_description:
      en_US: The whole program, as one source file.
      zh_Hans: 完整的程序，作为一个源文件。
      ja_JP: プログラム全体（1 つのソースファイル）。
      pt_BR: O programa inteiro, como um único arquivo-fonte.
    llm_description: >-
      The complete program as one source file. Print what you want to see: only standard output and standard error
      come back.
    form: llm
  - name: input
    type: string
    required: false
    label:
      en_US: Standard Input
      zh_Hans: 标准输入
      ja_JP: 標準入力
      pt_BR: Entrada padrão
    human_description:
      en_US: Text the program reads from standard input. Optional.
      zh_Hans: 程序从标准输入读取的文本。可选。
      ja_JP: プログラムが標準入力から読み込むテキスト。省略可。
      pt_BR: Texto que o programa lê da entrada padrão. Opcional.
    llm_description: Standard input (stdin) for the program, as text. Leave empty if the program reads none.
    form: llm
  - name: time_limit
    type: number
    required: false
    min: 0
    max: 30
    label:
      en_US: Time Limit (seconds)
      zh_Hans: 时间限制（秒）
      ja_JP: 制限時間（秒）
      pt_BR: Limite de tempo (segundos)
    human_description:
      en_US: Seconds the program may run, above 0 and at most 30. Leave empty for 30.
      zh_Hans: 程序可运行的秒数，大于 0 且不超过 30。留空则为 30。
      ja_JP: プログラムが実行できる秒数（0 より大きく 30 以下）。空欄なら 30。
      pt_BR: Segundos que o programa pode rodar, acima de 0 e no máximo 30. Deixe vazio para 30.
    llm_description: >-
      Seconds the program may run, above 0 and at most 30. Leave it out for the maximum of 30. Compiling before the
      run does not count.
    form: llm
output_schema:
  type: object
  properties:
    output:
      type: string
      description: Standard output, cut at 64 KB.
    error:
      type: string
      description: Standard error, or the compiler's errors.
    status:
      type: string
      description: success when the exit code is 0, error otherwise.
    exit_code:
      type: number
      description: The exit code. 124 is a time limit, 137 a memory limit.
    time:
      type: string
      description: Run time in seconds, as a decimal string.
    memory:
      type: string
      description: Memory used in KB, as a decimal string.
    truncated:
      type: boolean
      description: True when the output or errors went over 64 KB and were cut.
extra:
  python:
    source: tools/run_code.py
